name: CI/CD

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  BACKEND_SERVICE: storyjudge-api
  FRONTEND_SERVICE: storyjudge-web

jobs:
  # ============== CI Jobs ==============
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    services:
      mongodb-test:
        image: mongo:7
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5107/api

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: e2e

      - name: Start backend
        run: |
          dotnet run --project src/StoryJudge.Api &
          sleep 30
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          MongoDB__ConnectionString: mongodb://admin:testpassword@localhost:27018
          Jwt__Key: test-jwt-secret-key-for-e2e-testing-must-be-long-enough

      - name: Serve frontend
        run: |
          npx serve -s dist -l 5173 &
          sleep 5
        working-directory: frontend

      - name: Run E2E tests
        run: npm test -- --reporter=html
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:5107/api
          MONGODB_TEST_URI: mongodb://admin:testpassword@localhost:27018

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  # ============== CD Jobs (only on push to main/master) ==============
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/storyjudge/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          docker build -t $IMAGE ./backend
          docker push $IMAGE

      - name: Get Frontend URL
        id: frontend-url
        run: |
          # Get the actual frontend URL from Cloud Run
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --region=${{ env.GCP_REGION }} --format='value(status.url)' 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            echo "ERROR: Could not get frontend URL from Cloud Run"
            exit 1
          fi
          echo "Frontend URL for CORS: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          echo "Setting CORS_ALLOWED_ORIGINS=${{ steps.frontend-url.outputs.url }}"
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/storyjudge/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="\
              ASPNETCORE_ENVIRONMENT=Production,\
              CORS_ALLOWED_ORIGINS=${{ steps.frontend-url.outputs.url }},\
              Frontend__Url=${{ steps.frontend-url.outputs.url }}" \
            --set-secrets="\
              MongoDB__ConnectionString=MONGODB_CONNECTION_STRING:latest,\
              Jwt__Key=JWT_SECRET_KEY:latest,\
              OAuth__Google__ClientId=GOOGLE_CLIENT_ID:latest,\
              OAuth__Google__ClientSecret=GOOGLE_CLIENT_SECRET:latest"

      - name: Show Backend URL
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "Backend deployed to: $URL"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get Backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "Backend URL: $URL"
          echo "Frontend will use API URL: $URL/api"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/storyjudge/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
          docker build \
            --build-arg VITE_API_URL=${{ steps.backend-url.outputs.url }}/api \
            -t $IMAGE ./frontend
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/storyjudge/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated

      - name: Show Frontend URL
        run: |
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "Frontend deployed to: $URL"
