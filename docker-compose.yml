version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://storyjudge:storyjudge@mongodb:27017/storyjudge?authSource=storyjudge
      - MongoDB__DatabaseName=storyjudge
      - Jwt__SecretKey=dev-secret-key-change-in-production-min-32-chars
      - Jwt__Issuer=http://localhost:5000
      - Jwt__Audience=http://localhost:3000
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=storyjudge
    volumes:
      - mongodb_data:/data/db
      - ./backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  mongodb_data:
