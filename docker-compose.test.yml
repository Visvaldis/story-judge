version: '3.8'

services:
  mongodb-test:
    image: mongo:7.0
    container_name: storyjudge-mongodb-test
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: testpassword
      MONGO_INITDB_DATABASE: storyjudge_test
    tmpfs:
      - /data/db
